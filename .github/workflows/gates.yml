# The kit's own gates, run by GitHub on every push: the same commands a human runs locally, on a machine that is not
# ours. A repository whose thesis is "gates" and that does not run its own gates in public is the loudest signal an
# outside reviewer found in the file list - this file is the answer.
#
# What runs here and what does not:
#   - on every push / pull request, and once a day:
#       battery   the root kit and the v4 module against the SOURCE manager (build, tests, sizes, stale-build check -
#                 one exit code each), and a check that the v4 log names the sandbox suites (test/sim) that ran;
#       selftest  scripts/selftest.sh, which makes every guard in scripts/ that can be exercised offline go red on
#                 purpose (it runs mutation cases; 72 s on a warm local bench, 2026-09-23, longer on a cold runner),
#                 with reportlab and pypdf installed here (pinned) so that its dossier-pdf.py cases run - locally the
#                 kit installs neither and the selftest says it skipped them - and a check that they did run;
#       shellcheck  over scripts/*.sh and scripts/lib/*.sh, at severity "warning" (style and info notes are not gated);
#       battery-forge-1.8.3  the same battery on a SECOND pinned forge, the second row of the supported-versions table
#                 in foundry-kit/README.md. First seen green in run 35867090813 (2026-09-23), so that row says "supported";
#                 if it goes red, the job is removed and the row goes back to "unsupported" - never a job left red, never
#                 one marked allowed-to-fail. A third version is added the same way: a job first, then a row;
#   - NOT here: the battery against the REAL pool manager's bytecode. It needs an RPC endpoint, and no endpoint or
#     key goes into this repository or its CI. That leg is run locally (foundry-kit/v4/README.md) and reported in
#     the dossier.
# Foundry is PINNED: a nightly renames flags, and every flag in doctrine/JUDGES.md was checked against FOUNDRY_VERSION.
# No `--offline` here: the runner has no compiler cached and `--offline` forbids forge from fetching solc 0.8.26 - the
# first run of this workflow was red for exactly that, after a local replay had passed on a machine with solc cached.
# Nothing in this workflow talks to an RPC, so there is nothing for `--offline` to protect.
# A red run here is a finding, not a "flake": a fuzz campaign starts with no corpus in CI, so a rare counterexample
# can appear on any push - read the log before re-running.

name: gates

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  FOUNDRY_VERSION: v1.8.1
  FOUNDRY_VERSION_2: v1.8.3
  FORGE_STD_TAG: v1.16.2
  REPORTLAB_VERSION: "4.4.9"
  PYPDF_VERSION: "6.9.1"

jobs:
  battery:
    name: battery (root kit + v4 module, source manager)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge-std for the root kit, pinned
        run: git clone --quiet --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std foundry-kit/lib/forge-std
      - name: Uniswap v4 sources for the v4 module, at the pinned commits (never vendored - BUSL-1.1)
        run: scripts/install-v4.sh foundry-kit/v4
      - name: battery, root kit
        run: scripts/battery.sh foundry-kit
      - name: battery, v4 module, source manager
        run: V4_MANAGER=source scripts/battery.sh foundry-kit/v4
      - name: the sandbox suites ran (test/sim, by name)
        run: |
          grep -E '^Ran [0-9]+ tests? for test/sim/' foundry-kit/v4/.gauntlet/reports/02-test.txt \
            || { echo "no test/sim suite in the v4 battery's log: the sandbox did not run"; exit 1; }
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-logs
          path: |
            foundry-kit/.gauntlet/reports/
            foundry-kit/v4/.gauntlet/reports/
          if-no-files-found: ignore

  battery-forge-1-8-3:
    name: battery-forge-1.8.3 (second pinned forge, supported-versions table)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION_2 }}
      - name: forge version
        run: forge --version
      - name: forge-std for the root kit, pinned
        run: git clone --quiet --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std foundry-kit/lib/forge-std
      - name: Uniswap v4 sources for the v4 module, at the pinned commits
        run: scripts/install-v4.sh foundry-kit/v4
      - name: battery, root kit
        run: scripts/battery.sh foundry-kit
      - name: battery, v4 module, source manager
        run: V4_MANAGER=source scripts/battery.sh foundry-kit/v4
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-logs-forge-1.8.3
          path: |
            foundry-kit/.gauntlet/reports/
            foundry-kit/v4/.gauntlet/reports/
          if-no-files-found: ignore

  selftest:
    name: selftest (every guard that can be exercised offline, seen red)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge-std for the root kit, pinned
        run: git clone --quiet --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std foundry-kit/lib/forge-std
      # the dossier's PDF copy: reportlab renders it, pypdf reads it back in the selftest (no line lost on the way to
      # paper). A Python of its own, so that pip does not touch the runner's system Python; versions pinned
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reportlab and pypdf for the dossier cases, pinned
        run: python3 -m pip install --quiet "reportlab==${{ env.REPORTLAB_VERSION }}" "pypdf==${{ env.PYPDF_VERSION }}"
      - name: the dossier template renders as a PDF
        run: python3 scripts/dossier-pdf.py briefs/handoff-dossier.md "$RUNNER_TEMP/handoff-dossier.pdf"
      # the log is kept, and uploaded when the job fails: a red on the daily schedule is read days later, and the job's
      # own console is the only other copy of what went wrong
      - name: selftest
        shell: bash
        run: |
          set -o pipefail   # without it the step's exit code would be tee's, and a red selftest would pass
          mkdir -p selftest-logs
          scripts/selftest.sh 2>&1 | tee selftest-logs/selftest.txt
      - name: the dossier cases ran here (a skip for a missing reportlab or pypdf is not a pass)
        run: |
          grep -q '^  ok    no line of the fixture is lost on the way to paper' selftest-logs/selftest.txt \
            || { echo "the dossier-pdf.py cases did not run: reportlab or pypdf missing on the runner"; exit 1; }
      - name: keep the selftest log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest-logs/selftest.txt
          if-no-files-found: warn

  shellcheck:
    name: shellcheck (scripts/*.sh, scripts/lib/*.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck is on the runner image
        run: shellcheck --version
      - name: shellcheck, severity warning, following the sourced parse.sh
        run: shellcheck --external-sources --source-path=SCRIPTDIR --severity=warning scripts/*.sh scripts/lib/*.sh
